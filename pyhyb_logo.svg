<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Logo Section: Graphene Sheet & Benzene Ring with groups -->
  <g transform="translate(30, 20)">
    <!-- Graphene Lattice Background (Translucent hexagonal grid) -->
    <!-- Hex 1 -->
    <polygon points="100,50 130,67.3 130,102.7 100,120 70,102.7 70,67.3" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />
    <!-- Hex 2 (Right) -->
    <polygon points="160,50 190,67.3 190,102.7 160,120 130,102.7 130,67.3" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />
    <!-- Hex 3 (Bottom Left) -->
    <polygon points="70,102.7 100,120 100,155.4 70,172.7 40,155.4 40,120" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />
    <!-- Hex 4 (Bottom Right) -->
    <polygon points="130,102.7 160,120 160,155.4 130,172.7 100,155.4 100,120" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />

    <!-- Benzene Ring (Highlighted, deposited hybrid molecule) -->
    <!-- hover slightly above substrate -->
    <g transform="translate(15, -15)">
      <!-- Benzene Hexagon -->
      <polygon points="100,50 130,67.3 130,102.7 100,120 70,102.7 70,67.3" fill="rgba(6, 182, 212, 0.08)" stroke="url(#grad1)" stroke-width="4.5" filter="url(#glow)" />
      <!-- Benzene inner double bonds (alternating) -->
      <line x1="97" y1="58" x2="123" y2="73" stroke="url(#grad1)" stroke-width="2" />
      <line x1="123" y1="97" x2="103" y2="112" stroke="url(#grad1)" stroke-width="2" />
      <line x1="77" y1="97" x2="77" y2="73" stroke="url(#grad1)" stroke-width="2" />
      
      <!-- Attached Functional Groups -->
      <!-- Group 1: top-left -->
      <line x1="70" y1="67.3" x2="45" y2="52.8" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="45" cy="52.8" r="7" fill="#f43f5e" /> <!-- Oxygen/group red -->
      
      <!-- Group 2: top-right -->
      <line x1="130" y1="67.3" x2="155" y2="52.8" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="155" cy="52.8" r="7" fill="#3b82f6" /> <!-- Blue group -->

      <!-- Group 3: bottom -->
      <line x1="100" y1="120" x2="100" y2="148" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="100" cy="148" r="8" fill="#10b981" /> <!-- Green group -->
    </g>
  </g>
  
  <!-- Text Brand -->
  <text x="260" y="105" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">PyHyB</text>
  <text x="262" y="145" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">MOLECULAR HYBRID TECHNOLOGY</text>
</svg>
