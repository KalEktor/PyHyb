name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pycodestyle pytest pytest-cov setuptools
        pip install -e .

    - name: Lint with pylint
      run: |
        PYTHONPATH=. pylint pyhyb app.py launcher.py setup.py tests/

    - name: Style check with pycodestyle
      run: |
        pycodestyle pyhyb/ tests/ app.py launcher.py setup.py

    - name: Run tests with coverage enforcement
      run: |
        python -m pytest tests/ -v --tb=short \
          --cov=pyhyb \
          --cov-report=term-missing \
          --cov-fail-under=80
